services:
  web:
    image: ghcr.io/${GHCR_OWNER}/tracklume-web:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge
      - tracklume-web-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracklume.rule=Host(`tracklume.${PLATFORM_DOMAIN}`)"
      - "traefik.http.routers.tracklume.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tracklume.middlewares=secure-headers@file"
      - "traefik.http.services.tracklume.loadbalancer.server.port=3000"

networks:
  edge:
    external: true
  tracklume-web-internal:
    driver: bridge
